<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #c{width:100%;height:100%;display:block}
  #tip{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#687080;font-family:sans-serif;font-size:14px;padding:26px;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">正在加载数字人</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const expressions = {
  idle:   { neutral: 1 },
  listen: { neutral: 0.72, happy: 0.28 },
  think:  { neutral: 0.78, sad: 0.12 },
  talk:   { neutral: 0.76, happy: 0.24 },
  alarm:  { surprised: 0.82, angry: 0.22 },
  caring: { happy: 0.92 }
};
let vrm = null;
let talking = false;
let targetExpression = expressions.idle;
let currentExpression = {};
let elapsed = 0;
let nextBlink = 1.6;
let blinkTime = -1;

window.XLAvatar = {
  setState(value) { targetExpression = expressions[value] || expressions.idle; },
  setTalking(value) { talking = !!value; }
};

const tip = document.getElementById('tip');
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 30);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdde6ef, 1.65));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(1.5, 2.5, 2.2);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xb9d8ff, 0.9);
fillLight.position.set(-1.8, 1.2, 1.1);
scene.add(fillLight);
const clock = new THREE.Clock();

function setExpression(name, value) {
  try { vrm?.expressionManager?.setValue(name, value); } catch (_) {}
}

function frameUpperBody(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const focusY = box.min.y + size.y * 0.69;
  camera.position.set(center.x, focusY + size.y * 0.02, Math.max(1.35, size.y * 1.02));
  camera.lookAt(center.x, focusY, center.z);
  camera.near = Math.max(0.01, camera.position.z / 100);
  camera.far = Math.max(20, camera.position.z * 10);
  camera.updateProjectionMatrix();
}

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.load('./model.vrm', gltf => {
  vrm = gltf.userData.vrm;
  if (!vrm) {
    tip.textContent = '数字人模型格式不受支持';
    return;
  }
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  frameUpperBody(vrm.scene);
  tip.style.display = 'none';
  window.XiaolingNative?.ready();
  animate();
}, undefined, () => {
  tip.textContent = '数字人模型加载失败';
  window.XiaolingNative?.failed();
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  for (const name of ['neutral','happy','angry','sad','surprised']) {
    const target = targetExpression[name] || 0;
    currentExpression[name] = (currentExpression[name] || 0) + (target - (currentExpression[name] || 0)) * Math.min(1, dt * 7);
    setExpression(name, currentExpression[name]);
  }

  if (elapsed >= nextBlink && blinkTime < 0) blinkTime = 0;
  let blink = 0;
  if (blinkTime >= 0) {
    blinkTime += dt;
    blink = Math.sin(Math.min(1, blinkTime / 0.18) * Math.PI);
    if (blinkTime > 0.18) {
      blinkTime = -1;
      nextBlink = elapsed + 2.2 + Math.random() * 2.8;
    }
  }
  setExpression('blink', blink);
  const mouth = talking ? (0.18 + Math.abs(Math.sin(elapsed * 11.5)) * 0.58) : 0;
  setExpression('aa', mouth);

  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  if (head) {
    head.rotation.y = Math.sin(elapsed * 0.55) * 0.055;
    head.rotation.x = Math.sin(elapsed * 0.72) * 0.018 + (talking ? Math.sin(elapsed * 3.2) * 0.012 : 0);
  }
  const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
  if (chest) {
    chest.rotation.z = Math.sin(elapsed * 0.42) * 0.012;
    chest.rotation.x = Math.sin(elapsed * 0.82) * 0.006;
  }
  vrm.scene.position.y = Math.sin(elapsed * 0.8) * 0.006;
  vrm.update(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
