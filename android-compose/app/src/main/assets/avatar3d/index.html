<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}#c{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.js?v=1052';

const canvas=document.getElementById('c');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'})}
catch(e){window.XiaolingNative?.failed(String(e));throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.16;

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,20);
camera.position.set(0,0,6);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x1b0902,2.1));
const key=new THREE.DirectionalLight(0xff7b42,3.2);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x65ffe5,1.05);rim.position.set(-3,1,3);scene.add(rim);

const frame=new THREE.MeshStandardMaterial({color:0xdff3ff,emissive:0x000000,emissiveIntensity:0,roughness:.32,metalness:.12});
const black=new THREE.MeshStandardMaterial({color:0x020304,roughness:.28,metalness:.18});
const glow=new THREE.MeshBasicMaterial({color:0xfafffb,transparent:true,opacity:1});
const coolGlow=new THREE.MeshBasicMaterial({color:0x7fffe8,transparent:true,opacity:.18,depthWrite:false});
const warmGlow=new THREE.MeshBasicMaterial({color:0xffa545,transparent:true,opacity:.14,depthWrite:false});
const blushMat=new THREE.MeshBasicMaterial({color:0xff6f3c,transparent:true,opacity:.28,depthWrite:false});
const tearMat=new THREE.MeshBasicMaterial({color:0xb4fff3,transparent:true,opacity:.9});

function roundedShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}
function plate(w,h,r,d,material){
  const g=new THREE.ExtrudeGeometry(roundedShape(w,h,r),{depth:d,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.025,bevelThickness:.025});
  g.center();return new THREE.Mesh(g,material);
}
function oval(material,w,h,z=.12){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.5,26,18),material);m.scale.set(w,h,z);return m;
}
function glowOval(root,w,h){
  const warm=oval(warmGlow,w*1.34,h*1.34,.05),cool=oval(coolGlow,w*1.17,h*1.17,.06),core=oval(glow,w,h,.08);
  warm.position.z=.10;cool.position.z=.12;core.position.z=.14;root.add(warm,cool,core);return core;
}

const avatar=new THREE.Group();scene.add(avatar);
const shell=plate(2.24,1.88,.55,.28,frame);avatar.add(shell);
const screen=plate(1.98,1.62,.46,.16,black);screen.position.z=.20;avatar.add(screen);
const sheen=plate(1.70,.26,.12,.012,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.025}));
sheen.position.set(0,.55,.31);avatar.add(sheen);

const face=new THREE.Group();face.position.z=.35;avatar.add(face);
const eyes=[],eyeRoots=[],brows=[],cheeks=[],tears=[];
for(const side of[-1,1]){
  const root=new THREE.Group();root.position.set(side*.49,.28,0);face.add(root);eyeRoots.push(root);
  eyes.push(glowOval(root,.19,.18));
  const brow=oval(glow,.18,.025,.04);brow.position.set(side*.49,.57,.03);face.add(brow);brows.push(brow);
  const cheek=oval(blushMat,.20,.08,.03);cheek.position.set(side*.72,-.08,.01);cheek.visible=false;face.add(cheek);cheeks.push(cheek);
  const tear=oval(tearMat,.045,.13,.03);tear.position.set(side*.59,-.02,.05);tear.visible=false;face.add(tear);tears.push(tear);
}
const mouthRoot=new THREE.Group();mouthRoot.position.set(0,-.38,0);face.add(mouthRoot);
const mouth=glowOval(mouthRoot,.40,.065);
function expressionCurve(points,material,radius){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],.12)));
  return new THREE.Mesh(new THREE.TubeGeometry(curve,28,radius,8,false),material);
}
const smileGlow=expressionCurve([[-.38,.02],[-.19,-.08],[.02,-.12],[.22,-.06],[.38,.05]],coolGlow,.055);
const smile=expressionCurve([[-.35,.02],[-.18,-.065],[.02,-.10],[.21,-.05],[.35,.045]],glow,.028);
const frown=expressionCurve([[-.28,-.04],[-.13,.025],[.02,.05],[.15,.025],[.28,-.04]],glow,.025);
mouthRoot.add(smileGlow,smile,frown);

let state='idle',emotion='neutral',talking=false,audioLevel=0,mouthWide=0,mouthRound=0;
let emphasisTick=0,emphasisAt=-10,elapsed=0,blinkAt=1.7,blinkPhase=-1,nextGaze=1.1,gazeX=0,gazeY=0,targetGazeX=0,targetGazeY=0;
const allowed=['neutral','happy','caring','surprised','serious','warning','love','sad','shy','playful','proud','excited','relieved','confused','curious','sleepy','thinking','attentive','explaining','warm','focused','skeptical','apologetic','delighted','calm'];
const clamp=v=>{const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(1,n)):0};
window.XLAvatar={
  setState(v){state=['idle','listen','think','talk','alarm','caring'].includes(v)?v:'idle'},
  setTalking(v){talking=!!v},setAudioLevel(v){audioLevel=clamp(v)},
  setMouthShape(o,w,r,t){audioLevel=clamp(o);mouthWide=clamp(w);mouthRound=clamp(r);if((Number(t)||0)!==emphasisTick){emphasisTick=Number(t)||0;emphasisAt=elapsed}},
  setEmotion(v){emotion=allowed.includes(v)?v:'neutral'}
};

const clock=new THREE.Clock();
function resize(){
  const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width||innerWidth),h=Math.max(1,rect.height||innerHeight),a=w/h;
  // The face is wider than it is tall. On a narrow phone the viewport must
  // reserve enough world-space width first, otherwise the eyes and cheeks
  // are clipped even though the canvas itself has the correct size.
  const vw=Math.max(2.72,2.48*a),vh=vw/a;
  renderer.setSize(w,h,false);camera.left=-vw/2;camera.right=vw/2;camera.top=vh/2;camera.bottom=-vh/2;camera.lookAt(0,0,0);camera.updateProjectionMatrix();
  // Extruded rounded plates have a small legacy-origin offset on narrow
  // WebView projections. Compensate it only in portrait mode so both eyes
  // and the full blue frame remain visible.
  avatar.position.x=a<.75?-0.02:0;
}
addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);resize();
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;
  if(elapsed>=blinkAt&&blinkPhase<0)blinkPhase=0;let blink=0;
  if(blinkPhase>=0){blinkPhase+=dt;blink=Math.sin(Math.min(1,blinkPhase/.18)*Math.PI);if(blinkPhase>.18){blinkPhase=-1;blinkAt=elapsed+2.1+Math.random()*3.1}}
  if(elapsed>=nextGaze){targetGazeX=(Math.random()-.5)*(state==='listen'?.035:.075);targetGazeY=(Math.random()-.5)*.04;nextGaze=elapsed+1.2+Math.random()*2.5}
  gazeX+=(targetGazeX-gazeX)*Math.min(1,dt*3.2);gazeY+=(targetGazeY-gazeY)*Math.min(1,dt*3.2);
  const eyeOpen={surprised:1.26,excited:1.34,delighted:1.22,curious:1.14,focused:.76,skeptical:.82,warning:.68,serious:.66,sad:.80,caring:.88,apologetic:.76,relieved:1.04,calm:.86,sleepy:.20,confused:.92}[emotion]||1;
  eyeRoots.forEach((e,i)=>{const wink=emotion==='playful'&&i===1?.10:emotion==='skeptical'&&i===1?.68:1;e.scale.y=Math.max(.08,eyeOpen*wink-blink*.93);e.position.x=(i?1:-1)*.49+gazeX;e.position.y=.28+gazeY+((emotion==='confused'||emotion==='skeptical')&&i===1?-.05:0)});
  const browTilt=(emotion==='warning'||emotion==='serious'||emotion==='focused')?.34:((emotion==='confused'||emotion==='skeptical')?.20:0);
  brows.forEach(b=>b.visible=['warning','serious','focused','skeptical','confused','surprised','curious','sad','caring','apologetic'].includes(emotion));
  brows[0].rotation.z=browTilt;brows[1].rotation.z=-browTilt;
  brows[0].position.y=.57+(emotion==='confused'?.08:0);brows[1].position.y=.57-(emotion==='confused'?.03:0);
  cheeks.forEach(c=>c.visible=['love','shy','delighted'].includes(emotion));tears.forEach((t,i)=>t.visible=(emotion==='sad'||emotion==='apologetic')&&i===0);
  const voice=talking?Math.max(audioLevel,.10+Math.abs(Math.sin(elapsed*12.1))*.13):0;
  const open=emotion==='surprised'&&!talking?.34:.065+voice*.42+mouthRound*.17;
  const wide=((emotion==='warning'||emotion==='serious')?.58:emotion==='surprised'?.21:.40)+mouthWide*.20-mouthRound*.11;
  mouthRoot.scale.set(wide/.40,open/.065,1);
  const curved=!talking&&!['surprised','warning','serious','focused'].includes(emotion);
  mouthRoot.children.slice(0,3).forEach(part=>part.visible=!curved);
  smile.visible=curved&&!['sad','caring','confused','skeptical','apologetic'].includes(emotion);
  smileGlow.visible=smile.visible;frown.visible=curved&&['sad','caring','confused','skeptical','apologetic'].includes(emotion);
  if(curved)mouthRoot.scale.set(['happy','love','playful','excited','delighted'].includes(emotion)?1.16:emotion==='calm'?.88:1,1,1);
  const ea=elapsed-emphasisAt,em=ea>=0&&ea<.52?Math.sin(ea/.52*Math.PI):0;
  // Keep the digital human front-facing and centered. Expressions use eyes,
  // brows, mouth and breathing motion instead of tilting the whole model.
  face.rotation.set(0,gazeX*.18,0);
  avatar.position.y=Math.sin(elapsed*.80)*.025;
  avatar.rotation.set(0,0,0);
  // Keep the outer frame steady; animation belongs to the face, not the edge.
  frame.emissiveIntensity=0;
  renderer.render(scene,camera);
}
animate();renderer.render(scene,camera);window.XiaolingNative?.ready();
</script>
</body>
</html>
