<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #c{width:100%;height:100%;display:block}
  #tip{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">Loading avatar</div>
<script>
window.addEventListener('error', event =>
  window.XiaolingNative?.failed(event.message || 'JavaScript error'));
window.addEventListener('unhandledrejection', event =>
  window.XiaolingNative?.failed(String(event.reason || 'Unhandled promise rejection')));
</script>
<script type="module">
import * as THREE from './vendor/three.module.js?v=1041';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js?v=1041';
import { VRMLoaderPlugin, VRMUtils } from './vendor/three-vrm.module.min.js?v=1041';

const expressions = {
  idle: { neutral: 1 },
  listen: { neutral: 0.72, happy: 0.28 },
  think: { neutral: 0.78, sad: 0.12 },
  talk: { neutral: 0.76, happy: 0.24 },
  alarm: { surprised: 0.82, angry: 0.22 },
  caring: { happy: 0.92 }
};
const emotionExpressions = {
  neutral: {},
  happy: { neutral: 0.44, happy: 0.78 },
  caring: { neutral: 0.58, happy: 0.5, sad: 0.08 },
  surprised: { neutral: 0.4, surprised: 0.72 },
  serious: { neutral: 0.55, angry: 0.24, surprised: 0.12 }
};
let vrm = null;
let avatarScene = null;
let fallbackRig = null;
let readyNotified = false;
let talking = false;
let avatarState = 'idle';
let avatarEmotion = 'neutral';
let targetExpression = {...expressions.idle};
let currentExpression = {};
let audioLevel = 0;
let smoothAudioLevel = 0;
let mouthWide = 0;
let mouthRound = 0;
let smoothMouthWide = 0;
let smoothMouthRound = 0;
let lastEmphasisTick = 0;
let emphasisStartedAt = -10;
let emphasisSide = 1;
let elapsed = 0;
let nextBlink = 1.6;
let blinkTime = -1;
let nextGaze = 1.2;
let gazeX = 0;
let gazeY = 0;
let targetGazeX = 0;
let targetGazeY = 0;
let gestureStartedAt = 0;
let nextSpontaneousGesture = 2.4;
let spontaneousGestureStartedAt = -10;
let spontaneousGestureKind = 0;

function updateExpressionTarget() {
  targetExpression = {...expressions[avatarState], ...(emotionExpressions[avatarEmotion] || {})};
}

window.XLAvatar = {
  setState(value) {
    const nextState = expressions[value] ? value : 'idle';
    if (nextState !== avatarState) gestureStartedAt = elapsed;
    avatarState = nextState;
    updateExpressionTarget();
  },
  setTalking(value) { talking = !!value; },
  setAudioLevel(value) {
    const parsed = Number(value);
    audioLevel = Number.isFinite(parsed) ? Math.max(0, Math.min(1, parsed)) : 0;
  },
  setMouthShape(open, wide, round, emphasisTick) {
    const safe = value => {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? Math.max(0, Math.min(1, parsed)) : 0;
    };
    audioLevel = safe(open);
    mouthWide = safe(wide);
    mouthRound = safe(round);
    const tick = Number(emphasisTick) || 0;
    if (tick !== lastEmphasisTick) {
      lastEmphasisTick = tick;
      emphasisStartedAt = elapsed;
      emphasisSide *= -1;
      targetGazeX = 0;
      targetGazeY = -0.012;
    }
  },
  setEmotion(value) {
    avatarEmotion = emotionExpressions[value] ? value : 'neutral';
    updateExpressionTarget();
  }
};

const tip = document.getElementById('tip');
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'), alpha: true, antialias: true, powerPreference: 'low-power'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 30);
scene.add(new THREE.HemisphereLight(0xfff8f4, 0xdce8f2, 1.7));
const keyLight = new THREE.DirectionalLight(0xfff7f1, 2.2);
keyLight.position.set(1.5, 2.5, 2.2);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xb9d8ff, 0.9);
fillLight.position.set(-1.8, 1.2, 1.1);
scene.add(fillLight);
const clock = new THREE.Clock();

function notifyReady() {
  if (readyNotified) return;
  readyNotified = true;
  tip.style.display = 'none';
  window.XiaolingNative?.ready();
}

function activateFallbackAvatar() {
  if (avatarScene) return;
  const group = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color: 0xf1c8b4, roughness: 0.72});
  const hair = new THREE.MeshStandardMaterial({color: 0x25303b, roughness: 0.58});
  const cloth = new THREE.MeshStandardMaterial({color: 0x147d8f, roughness: 0.6, metalness: 0.08});
  const white = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.5});
  const dark = new THREE.MeshStandardMaterial({color: 0x172027, roughness: 0.45});

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.46, 0.64, 8, 20), cloth);
  torso.position.y = 0.48;
  torso.scale.set(1.05, 1, 0.72);
  group.add(torso);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.24, 20), skin);
  neck.position.y = 1.05;
  group.add(neck);

  const head = new THREE.Group();
  head.position.y = 1.46;
  const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.39, 28, 22), hair);
  hairBack.scale.set(0.9, 1.08, 0.82);
  head.add(hairBack);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.34, 28, 22), skin);
  face.position.z = 0.055;
  face.scale.set(0.86, 1, 0.78);
  head.add(face);
  const fringe = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.48), hair);
  fringe.position.set(0, 0.08, 0.1);
  fringe.scale.set(0.92, 0.82, 0.82);
  head.add(fringe);

  const eyeGeometry = new THREE.SphereGeometry(0.038, 16, 12);
  const leftEye = new THREE.Mesh(eyeGeometry, dark);
  const rightEye = new THREE.Mesh(eyeGeometry, dark);
  leftEye.position.set(-0.105, 0.015, 0.315);
  rightEye.position.set(0.105, 0.015, 0.315);
  head.add(leftEye, rightEye);
  const eyeLight = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), white);
  eyeLight.position.set(-0.093, 0.027, 0.348);
  const eyeLight2 = eyeLight.clone();
  eyeLight2.position.x = 0.117;
  head.add(eyeLight, eyeLight2);
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 10), new THREE.MeshStandardMaterial({color: 0xa94f59}));
  mouth.position.set(0, -0.13, 0.31);
  mouth.scale.set(1.15, 0.22, 0.3);
  head.add(mouth);
  group.add(head);

  const armGeometry = new THREE.CapsuleGeometry(0.12, 0.48, 6, 14);
  const leftArm = new THREE.Mesh(armGeometry, cloth);
  const rightArm = new THREE.Mesh(armGeometry, cloth);
  leftArm.position.set(-0.49, 0.53, 0);
  rightArm.position.set(0.49, 0.53, 0);
  leftArm.rotation.z = -0.22;
  rightArm.rotation.z = 0.22;
  group.add(leftArm, rightArm);

  fallbackRig = {group, head, leftEye, rightEye, mouth, leftArm, rightArm};
  avatarScene = group;
  scene.add(group);
  frameUpperBody(group);
  notifyReady();
}

function setExpression(name, value) {
  try { vrm?.expressionManager?.setValue(name, value); } catch (_) {}
}

function frameUpperBody(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const focusY = box.min.y + size.y * 0.75;
  const narrowScreenScale = Math.max(1, 0.78 / camera.aspect);
  camera.position.set(center.x, focusY + size.y * 0.025, Math.max(1.2, size.y * 0.88 * narrowScreenScale));
  camera.lookAt(center.x, focusY, center.z);
  camera.near = Math.max(0.01, camera.position.z / 100);
  camera.far = Math.max(20, camera.position.z * 10);
  camera.updateProjectionMatrix();
}

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.load('./model.vrm', gltf => {
  vrm = gltf.userData.vrm;
  if (!vrm) {
    activateFallbackAvatar();
    return;
  }
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  gltf.scene.rotation.y = Math.PI;
  gltf.scene.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(Boolean).forEach(material => {
      if (material.name === 'Arla Clothes' && material.color) {
        material.color.set(0x0e1820);
        if (material.emissive) material.emissive.set(0x063642);
        if ('emissiveIntensity' in material) material.emissiveIntensity = 0.28;
        material.needsUpdate = true;
      }
      if (material.name === 'Helmet New' && material.color) {
        material.color.set(0x29333d);
        if (material.emissive) material.emissive.set(0x082d38);
        if ('emissiveIntensity' in material) material.emissiveIntensity = 0.2;
        material.needsUpdate = true;
      }
    });
  });
  if (fallbackRig) {
    scene.remove(fallbackRig.group);
    fallbackRig = null;
  }
  avatarScene = vrm.scene;
  scene.add(avatarScene);
  frameUpperBody(vrm.scene);
  notifyReady();
}, undefined, error => {
  console.error('VRM load failed', error);
  activateFallbackAvatar();
});

setTimeout(activateFallbackAvatar, 6500);
animate();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  for (const name of ['neutral', 'happy', 'angry', 'sad', 'surprised']) {
    const target = targetExpression[name] || 0;
    currentExpression[name] = (currentExpression[name] || 0)
      + (target - (currentExpression[name] || 0)) * Math.min(1, dt * 7);
    setExpression(name, currentExpression[name]);
  }

  if (elapsed >= nextBlink && blinkTime < 0) blinkTime = 0;
  let blink = 0;
  if (blinkTime >= 0) {
    blinkTime += dt;
    blink = Math.sin(Math.min(1, blinkTime / 0.18) * Math.PI);
    if (blinkTime > 0.18) {
      blinkTime = -1;
      nextBlink = elapsed + 2.2 + Math.random() * 2.8;
    }
  }
  setExpression('blink', blink);
  smoothAudioLevel += (audioLevel - smoothAudioLevel) * Math.min(1, dt * 18);
  smoothMouthWide += (mouthWide - smoothMouthWide) * Math.min(1, dt * 16);
  smoothMouthRound += (mouthRound - smoothMouthRound) * Math.min(1, dt * 16);
  const fallbackMouth = talking && audioLevel < 0.01 ? 0.08 + Math.abs(Math.sin(elapsed * 11.5)) * 0.12 : 0;
  const mouthEnergy = talking ? Math.max(smoothAudioLevel, fallbackMouth) : 0;
  const syllable = elapsed * 13.5;
  const fallbackShape = audioLevel < 0.01 ? Math.abs(Math.sin(syllable)) * fallbackMouth : 0;
  setExpression('aa', Math.max(fallbackShape, mouthEnergy * (1 - smoothMouthWide * 0.24 - smoothMouthRound * 0.2)));
  setExpression('ih', talking ? smoothMouthWide : 0);
  setExpression('ou', talking ? smoothMouthRound : 0);

  if (elapsed >= nextGaze) {
    const focus = avatarState === 'listen' ? 0.32 : 1;
    targetGazeX = (Math.random() - 0.5) * 0.12 * focus;
    targetGazeY = (Math.random() - 0.5) * 0.055 * focus;
    nextGaze = elapsed + 1.3 + Math.random() * 2.4;
  }
  gazeX += (targetGazeX - gazeX) * Math.min(1, dt * 2.7);
  gazeY += (targetGazeY - gazeY) * Math.min(1, dt * 2.7);

  const gestureAge = elapsed - gestureStartedAt;
  const gesture = gestureAge < 1.2 ? Math.sin((gestureAge / 1.2) * Math.PI) : 0;
  const emphasisAge = elapsed - emphasisStartedAt;
  const speechEmphasis = emphasisAge >= 0 && emphasisAge < 0.52
    ? Math.sin((emphasisAge / 0.52) * Math.PI) : 0;
  const speechEnergy = talking ? 0.35 + smoothAudioLevel * 0.65 : 0;
  if (elapsed >= nextSpontaneousGesture) {
    spontaneousGestureStartedAt = elapsed;
    spontaneousGestureKind = Math.floor(Math.random() * 3);
    nextSpontaneousGesture = elapsed + (talking ? 2.2 : 4.5) + Math.random() * 3.2;
  }
  const spontaneousAge = elapsed - spontaneousGestureStartedAt;
  const spontaneous = spontaneousAge >= 0 && spontaneousAge < 1.4
    ? Math.sin((spontaneousAge / 1.4) * Math.PI) : 0;
  if (speechEmphasis > 0) {
    setExpression('surprised', Math.min(1, (currentExpression.surprised || 0) + speechEmphasis * 0.08));
  }
  const head = vrm?.humanoid?.getNormalizedBoneNode('head');
  if (head) {
    head.rotation.y = gazeX + Math.sin(elapsed * 0.42) * 0.025;
    head.rotation.x = gazeY + Math.sin(elapsed * 0.72) * 0.018
      + (talking ? Math.sin(elapsed * 3.2) * 0.018 * speechEnergy : 0)
      - speechEmphasis * 0.045
      + (avatarState === 'listen' ? -0.045 * gesture : 0);
  }
  const neck = vrm?.humanoid?.getNormalizedBoneNode('neck');
  if (neck) {
    neck.rotation.y = Math.sin(elapsed * 0.31) * 0.016
      + (avatarState === 'think' ? 0.055 : 0)
      + (spontaneousGestureKind === 0 ? spontaneous * 0.025 : 0);
    neck.rotation.z = avatarState === 'think' ? -0.035 : 0;
  }
  const chest = vrm?.humanoid?.getNormalizedBoneNode('chest');
  if (chest) {
    chest.rotation.z = Math.sin(elapsed * 0.42) * (0.018 + speechEnergy * 0.022);
    chest.rotation.x = Math.sin(elapsed * 0.82) * 0.01
      + (avatarState === 'listen' ? -0.026 : 0)
      + (avatarState === 'caring' ? 0.02 * gesture : 0);
  }
  const spine = vrm?.humanoid?.getNormalizedBoneNode('spine');
  if (spine) spine.rotation.y = Math.sin(elapsed * 0.34) * 0.018 + (avatarState === 'think' ? 0.035 : 0);
  const hips = vrm?.humanoid?.getNormalizedBoneNode('hips');
  if (hips) hips.rotation.y = Math.sin(elapsed * 0.36) * 0.035;
  const leftArm = vrm?.humanoid?.getNormalizedBoneNode('leftUpperArm');
  const rightArm = vrm?.humanoid?.getNormalizedBoneNode('rightUpperArm');
  const leftLowerArm = vrm?.humanoid?.getNormalizedBoneNode('leftLowerArm');
  const rightLowerArm = vrm?.humanoid?.getNormalizedBoneNode('rightLowerArm');
  const talkGesture = Math.sin(elapsed * 1.9) * 0.055 * speechEnergy;
  const emphasisGesture = speechEmphasis * 0.11 * emphasisSide;
  const caringGesture = avatarState === 'caring' ? gesture * 0.09 : 0;
  const alarmGesture = avatarState === 'alarm' ? gesture * 0.13 : 0;
  if (leftArm) leftArm.rotation.z = 1.12 + talkGesture - caringGesture + alarmGesture + emphasisGesture;
  if (rightArm) {
    rightArm.rotation.z = -1.12 - Math.sin(elapsed * 1.9 + 0.8) * 0.055 * speechEnergy
      + caringGesture + alarmGesture + emphasisGesture;
  }
  if (leftLowerArm) {
    leftLowerArm.rotation.y = -0.08 - speechEnergy * 0.12
      - (spontaneousGestureKind === 1 ? spontaneous * 0.13 : 0);
  }
  if (rightLowerArm) {
    rightLowerArm.rotation.y = 0.08 + speechEnergy * 0.12
      + (spontaneousGestureKind === 2 ? spontaneous * 0.13 : 0);
  }
  if (vrm) {
    vrm.scene.position.y = Math.sin(elapsed * 0.8) * 0.012;
    vrm.scene.position.z = avatarState === 'listen' ? 0.025 : 0;
    vrm.scene.rotation.y = Math.PI + Math.sin(elapsed * 0.32) * 0.022;
    vrm.update(dt);
  } else if (fallbackRig) {
    const fallbackBlink = Math.max(0.08, 1 - blink * 0.92);
    fallbackRig.leftEye.scale.y = fallbackBlink;
    fallbackRig.rightEye.scale.y = fallbackBlink;
    fallbackRig.mouth.scale.y = talking ? 0.24 + mouthEnergy * 1.7 : 0.22;
    fallbackRig.head.rotation.y = gazeX * 1.6;
    fallbackRig.head.rotation.x = gazeY + (talking ? Math.sin(elapsed * 3.1) * 0.018 : 0);
    fallbackRig.leftArm.rotation.z = -0.22 - talkGesture * 1.8;
    fallbackRig.rightArm.rotation.z = 0.22 + talkGesture * 1.8;
    fallbackRig.group.position.y = Math.sin(elapsed * 0.8) * 0.012;
  }
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  if (avatarScene) frameUpperBody(avatarScene);
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
