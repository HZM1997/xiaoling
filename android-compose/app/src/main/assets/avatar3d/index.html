<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #c{position:relative;z-index:1;width:100%;height:100%;display:block}
  #ring{position:absolute;z-index:2;left:50%;top:37%;width:min(82vw,60vh);aspect-ratio:1;
    transform:translate(-50%,-50%);border:3px solid rgba(20,115,230,.78);border-radius:50%;
    pointer-events:none;box-sizing:border-box;transition:border-color .18s ease,filter .18s ease}
  #ring[data-state="listen"]{border-color:#1473e6;filter:drop-shadow(0 0 5px rgba(20,115,230,.45));animation:pulse 1.05s ease-in-out infinite}
  #ring[data-state="talk"]{border-color:#16a17b;filter:drop-shadow(0 0 5px rgba(22,161,123,.38));animation:pulse .72s ease-in-out infinite}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.025);opacity:.72}}
  #tip{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ring" data-state="idle"></div>
<div id="tip">Loading avatar</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const expressions = {
  idle: { neutral: 1 },
  listen: { neutral: 0.72, happy: 0.28 },
  think: { neutral: 0.78, sad: 0.12 },
  talk: { neutral: 0.76, happy: 0.24 },
  alarm: { surprised: 0.82, angry: 0.22 },
  caring: { happy: 0.92 }
};
const emotionExpressions = {
  neutral: {},
  happy: { neutral: 0.44, happy: 0.78 },
  caring: { neutral: 0.58, happy: 0.5, sad: 0.08 },
  surprised: { neutral: 0.4, surprised: 0.72 },
  serious: { neutral: 0.55, angry: 0.24, surprised: 0.12 }
};
let vrm = null;
let talking = false;
let avatarState = 'idle';
let avatarEmotion = 'neutral';
let targetExpression = {...expressions.idle};
let currentExpression = {};
let audioLevel = 0;
let smoothAudioLevel = 0;
let elapsed = 0;
let nextBlink = 1.6;
let blinkTime = -1;
let nextGaze = 1.2;
let gazeX = 0;
let gazeY = 0;
let targetGazeX = 0;
let targetGazeY = 0;
let gestureStartedAt = 0;

function updateExpressionTarget() {
  targetExpression = {...expressions[avatarState], ...(emotionExpressions[avatarEmotion] || {})};
}

window.XLAvatar = {
  setState(value) {
    const nextState = expressions[value] ? value : 'idle';
    if (nextState !== avatarState) gestureStartedAt = elapsed;
    avatarState = nextState;
    updateExpressionTarget();
    document.getElementById('ring').dataset.state = avatarState;
  },
  setTalking(value) { talking = !!value; },
  setAudioLevel(value) {
    const parsed = Number(value);
    audioLevel = Number.isFinite(parsed) ? Math.max(0, Math.min(1, parsed)) : 0;
  },
  setEmotion(value) {
    avatarEmotion = emotionExpressions[value] ? value : 'neutral';
    updateExpressionTarget();
  }
};

const tip = document.getElementById('tip');
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'), alpha: true, antialias: true, powerPreference: 'low-power'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 30);
scene.add(new THREE.HemisphereLight(0xfff8f4, 0xdce8f2, 1.7));
const keyLight = new THREE.DirectionalLight(0xfff7f1, 2.2);
keyLight.position.set(1.5, 2.5, 2.2);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xb9d8ff, 0.9);
fillLight.position.set(-1.8, 1.2, 1.1);
scene.add(fillLight);
const clock = new THREE.Clock();

function setExpression(name, value) {
  try { vrm?.expressionManager?.setValue(name, value); } catch (_) {}
}

function frameUpperBody(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const focusY = box.min.y + size.y * 0.75;
  const narrowScreenScale = Math.max(1, 0.78 / camera.aspect);
  camera.position.set(center.x, focusY + size.y * 0.025, Math.max(1.2, size.y * 0.88 * narrowScreenScale));
  camera.lookAt(center.x, focusY, center.z);
  camera.near = Math.max(0.01, camera.position.z / 100);
  camera.far = Math.max(20, camera.position.z * 10);
  camera.updateProjectionMatrix();
}

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.load('./model.vrm', gltf => {
  vrm = gltf.userData.vrm;
  if (!vrm) {
    tip.textContent = 'Avatar format is not supported';
    window.XiaolingNative?.failed();
    return;
  }
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  gltf.scene.rotation.y = Math.PI;
  gltf.scene.traverse(object => {
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    materials.filter(Boolean).forEach(material => {
      if (material.name === 'Arla Clothes' && material.color) {
        material.color.set(0x17191d);
        material.needsUpdate = true;
      }
    });
  });
  scene.add(vrm.scene);
  frameUpperBody(vrm.scene);
  tip.style.display = 'none';
  window.XiaolingNative?.ready();
  animate();
}, undefined, () => {
  tip.textContent = 'Avatar failed to load';
  window.XiaolingNative?.failed();
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  for (const name of ['neutral', 'happy', 'angry', 'sad', 'surprised']) {
    const target = targetExpression[name] || 0;
    currentExpression[name] = (currentExpression[name] || 0)
      + (target - (currentExpression[name] || 0)) * Math.min(1, dt * 7);
    setExpression(name, currentExpression[name]);
  }

  if (elapsed >= nextBlink && blinkTime < 0) blinkTime = 0;
  let blink = 0;
  if (blinkTime >= 0) {
    blinkTime += dt;
    blink = Math.sin(Math.min(1, blinkTime / 0.18) * Math.PI);
    if (blinkTime > 0.18) {
      blinkTime = -1;
      nextBlink = elapsed + 2.2 + Math.random() * 2.8;
    }
  }
  setExpression('blink', blink);
  smoothAudioLevel += (audioLevel - smoothAudioLevel) * Math.min(1, dt * 18);
  const mouthEnergy = talking ? Math.max(smoothAudioLevel, audioLevel > 0.01 ? 0.04 : 0) : 0;
  const syllable = elapsed * 13.5;
  setExpression('aa', mouthEnergy * (0.54 + Math.abs(Math.sin(syllable)) * 0.46));
  setExpression('ih', mouthEnergy * Math.max(0, Math.sin(syllable + 2.1)) * 0.42);
  setExpression('ou', mouthEnergy * Math.max(0, Math.sin(syllable + 4.2)) * 0.36);

  if (elapsed >= nextGaze) {
    const focus = avatarState === 'listen' ? 0.32 : 1;
    targetGazeX = (Math.random() - 0.5) * 0.12 * focus;
    targetGazeY = (Math.random() - 0.5) * 0.055 * focus;
    nextGaze = elapsed + 1.3 + Math.random() * 2.4;
  }
  gazeX += (targetGazeX - gazeX) * Math.min(1, dt * 2.7);
  gazeY += (targetGazeY - gazeY) * Math.min(1, dt * 2.7);

  const gestureAge = elapsed - gestureStartedAt;
  const gesture = gestureAge < 1.2 ? Math.sin((gestureAge / 1.2) * Math.PI) : 0;
  const speechEnergy = talking ? 0.35 + smoothAudioLevel * 0.65 : 0;
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  if (head) {
    head.rotation.y = gazeX + Math.sin(elapsed * 0.42) * 0.025;
    head.rotation.x = gazeY + Math.sin(elapsed * 0.72) * 0.018
      + (talking ? Math.sin(elapsed * 3.2) * 0.018 * speechEnergy : 0)
      + (avatarState === 'listen' ? -0.045 * gesture : 0);
  }
  const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
  if (chest) {
    chest.rotation.z = Math.sin(elapsed * 0.42) * (0.018 + speechEnergy * 0.022);
    chest.rotation.x = Math.sin(elapsed * 0.82) * 0.01
      + (avatarState === 'listen' ? -0.026 : 0)
      + (avatarState === 'caring' ? 0.02 * gesture : 0);
  }
  const spine = vrm.humanoid?.getNormalizedBoneNode('spine');
  if (spine) spine.rotation.y = Math.sin(elapsed * 0.34) * 0.018 + (avatarState === 'think' ? 0.035 : 0);
  const hips = vrm.humanoid?.getNormalizedBoneNode('hips');
  if (hips) hips.rotation.y = Math.sin(elapsed * 0.36) * 0.035;
  const leftArm = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
  const rightArm = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
  const talkGesture = Math.sin(elapsed * 1.9) * 0.055 * speechEnergy;
  const caringGesture = avatarState === 'caring' ? gesture * 0.09 : 0;
  const alarmGesture = avatarState === 'alarm' ? gesture * 0.13 : 0;
  if (leftArm) leftArm.rotation.z = 1.12 + talkGesture - caringGesture + alarmGesture;
  if (rightArm) {
    rightArm.rotation.z = -1.12 - Math.sin(elapsed * 1.9 + 0.8) * 0.055 * speechEnergy
      + caringGesture + alarmGesture;
  }
  vrm.scene.position.y = Math.sin(elapsed * 0.8) * 0.012;
  vrm.scene.rotation.y = Math.PI + Math.sin(elapsed * 0.32) * 0.022;
  vrm.update(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  if (vrm) frameUpperBody(vrm.scene);
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
